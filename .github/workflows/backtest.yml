name: Backtest Strategy

on:
  push:
    branches:
      - copilot/fix-short-conditions-v5b
  pull_request:
    branches:
      - main

jobs:
  backtest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pandas numpy
      
      - name: Run backtest
        id: backtest
        continue-on-error: true
        run: |
          # Run the backtest and capture output
          python backtest-strategy-v5B-fixed.py > backtest_output.txt 2>&1
          
          # Read the output into a variable for later use
          cat backtest_output.txt
          
          # Also save to job summary
          echo "## Backtest Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat backtest_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Post results as PR comment
        if: success() || failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Read the backtest output
            let output = '';
            try {
              output = fs.readFileSync('backtest_output.txt', 'utf8');
            } catch (error) {
              output = 'Error: Could not read backtest output file';
            }
            
            // Create comment body
            const commentBody = `## 🔬 Backtest Results
            
            \`\`\`
            ${output}
            \`\`\`
            
            ---
            *Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
            `;
            
            // Post comment on PR #8
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 8,
                body: commentBody
              });
              console.log('Successfully posted comment to PR #8');
            } catch (error) {
              console.error('Error posting comment:', error.message);
              // Don't fail the workflow if comment posting fails
            }
